[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eddsa-threshold"
version = "0.2alpha1"
authors = [
	{ name = "Maximilian", email = "23641084+xfallme@users.noreply.github.com" },
]
description = "Educational EdDSA and FROST implementations"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.14"
dependencies = []
keywords = ["cryptography", "threshold", "eddsa", "frost"]

[project.urls]
Homepage = "https://github.com/xfallme/EdDSA-Threshold"
Repository = "https://github.com/xfallme/EdDSA-Threshold"
Issues = "https://github.com/xfallme/EdDSA-Threshold/issues"

[project.optional-dependencies]
dev = [
	"black>=26.5",
	"mypy>=2.1",
	"pytest==9.0.3",
	"pytest-cases==3.10.1",
	"pytest-mock==3.15.1",
	"ruff>=0.15",
	"pynacl>=1.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["eddsa_threshold*"]

[tool.autopep8]
max_line_length = 160

[tool.black]
line-length = 160
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = ["src/eddsa_threshold"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"