[project]
name = "eddsa-threshhold"
version = "0.2.0"
description = "Educational EdDSA and FROST implementations"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.10"
dependencies = ["pynacl>=1.5.0"]

[project.optional-dependencies]
dev = [
	"black>=26.3",
	"mypy>=2.0",
	"pytest>=9.0",
	"pytest-cases>=3.10",
	"pytest-mock>=3.15",
	"ruff>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.autopep8]
max_line_length = 160

[tool.black]
line-length = 160
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
files = ["src/eddsa_threshhold"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"