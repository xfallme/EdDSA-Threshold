[project]
name = "eddsa-threshold"
version = "0.2.0"
description = "Educational EdDSA and FROST implementations"
readme = "README.md"
license = "0BSD"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
	"black>=26.5",
	"mypy>=2.1",
	"pytest==9.0.3",
	"pytest-cases==3.10.1",
	"pytest-mock==3.15.1",
	"ruff>=0.15",
	"pynacl>=1.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.autopep8]
max_line_length = 160

[tool.black]
line-length = 160
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
files = ["src/eddsa_threshold"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"